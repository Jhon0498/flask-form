<!DOCTYPE html>
<html lang= "pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    </head>

<body>
    <div class="container">

    <h1>📚 Biblioteca</h1>

  <p class="descricao">
    Cadastre seus livros e organize sua biblioteca.
</p>

    <form method ="POST">

    <div class="campo">

        <label>Título</label>

        <input type="text" name="titulo">

        </div>

    <div class="campo">
        <label>Autor</label>

        <input type="text" name="autor">



       </div>

       <label>Categoria</label>

       <select name = "categoria" required></select>
       <option value="">Selecione...</option>

    <option>Romance</option>

    <option>Ficção Científica</option>

    <option>Fantasia</option>

    <option>Terror</option>

    <option>Suspense</option>

    <option>Drama</option>

    <option>Biografia</option>

    <option>História</option>

    <option>Autoajuda</option>

    <option>Tecnologia</option>



 <button type="submit">Cadastrar</button>

</select>
    </form>

        <h2> Livro cadastrado:</h2>

        <p>Título: {{ titulo }}</p>

        <p>Autor: {{ autor }}</p>

        <h2>Todos os livros:</h2>

        {%for livro in livros %}

        <div class="Livro">
            <h3> {{ livro[1] }}</h3
            <p> {{ livro[2] }}</p>

      <form action="/excluir/{{ livro[0] }}" method="POST">

    <button
        class="excluir"
        type="submit"
        onclick="return confirm('Deseja realmente excluir este livro?')">
        Excluir
    </button>

</form>

</div>
            {% endfor %}
</div>

</body>
</html>
